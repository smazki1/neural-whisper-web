<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="home-font-preload" rel="preload" as="font" type="font/ttf" href="/src/assets/fonts/heebo-hero-bold.ttf" crossorigin media="not all">
    <link rel="stylesheet" href="/src/components/experiments/hero-layout.css">
    <link id="home-image-preload" rel="preload" as="image" href="/src/assets/experiments/avi-hero-poster.jpg" fetchpriority="high" media="not all">
    <script>
      for (const id of ['home-font-preload', 'home-image-preload']) {
        const link = document.getElementById(id);
        if (location.pathname === '/') link.media = 'all';
        else link.remove();
      }
    </script>
    <title>אבי פריד - הדרכות AI לארגונים ויזמים</title>
    <meta name="description" content="הדרכות וסדנאות שיהפכו את ה-AI לכוח שלך. ללא תלות, ללא סיבוכים - רק בהירות, כלים ומיומנויות שיעזרו לך להישאר רלוונטי בעידן הדיגיטלי." />
    <meta name="author" content="AI Master - Avi Fried" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/lovable-uploads/ce5b5687-c89c-4546-83ae-f72e291dc216.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI Master">
    <link rel="apple-touch-icon" href="/lovable-uploads/ce5b5687-c89c-4546-83ae-f72e291dc216.png">

    <meta property="og:title" content="אבי פריד - הדרכות AI לארגונים ויזמים" />
    <meta property="og:description" content="הדרכות וסדנאות שיהפכו את ה-AI לכוח שלך. ללא תלות, ללא סיבוכים - רק בהירות, כלים ומיומנויות שיעזרו לך להישאר רלוונטי בעידן הדיגיטלי." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/ce5b5687-c89c-4546-83ae-f72e291dc216.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="אבי פריד - הדרכות AI לארגונים ויזמים" />
    <meta name="twitter:description" content="הדרכות וסדנאות שיהפכו את ה-AI לכוח שלך. ללא תלות, ללא סיבוכים - רק בהירות, כלים ומיומנויות שיעזרו לך להישאר רלוונטי בעידן הדיגיטלי." />
    <meta name="twitter:site" content="@AImaster_il" />
    <meta name="twitter:image" content="/lovable-uploads/ce5b5687-c89c-4546-83ae-f72e291dc216.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Immediate homepage shell; React replaces it using the same image and layout. -->
    <template id="home-loading-template">
      <div style="padding-top:80px;min-height:100svh;box-sizing:border-box">
        <section class="video-hero" dir="rtl">
          <div class="video-hero__fallback" aria-hidden="true"></div>
          <div class="video-hero__shade" aria-hidden="true"></div>
          <div class="video-hero__content"><h1>להיות על זה בעידן <span class="video-hero__nowrap">ה-<span class="video-hero__accent">AI</span></span></h1></div>
        </section>
      </div>
    </template>
    <script>
      if (location.pathname === '/') {
        document.body.style.margin = '0';
        document.getElementById('root').append(document.getElementById('home-loading-template').content.cloneNode(true));
      }
      document.getElementById('home-loading-template').remove();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
